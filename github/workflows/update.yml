name: Auto Merge IPA Repos

on:
  schedule:
    - cron: '0 */12 * * *' # Jalan otomatis tiap 12 jam
  workflow_dispatch: # Biar bisa lo trigger manual kapan aja

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run merge script
        run: python merge.py
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Update merged repo.json" || exit 0
          git push
